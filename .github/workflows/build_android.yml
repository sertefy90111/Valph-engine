name: Build Android

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE*'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE*'
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture'
        type: choice
        options: [ARM64, ARM]
        default: ARM64
      configuration:
        description: 'Build configuration'
        type: choice
        options: [Release, Development, Debug]
        default: Release

run-name: Android ${{ inputs.arch || 'ARM64' }} ${{ inputs.configuration || 'Release' }} (#${{ github.run_number }})

# Kill outdated runs on new push to the same branch — saves queue time and minutes.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_ROLL_FORWARD: minor
  NUGET_XMLDOC_MODE: skip
  DOTNET_VERSION: 8.0.x # use runner-preinstalled SDK instead of downloading a pinned patch
  VULKAN_VERSION: 1.3.290.0

jobs:
  game-android:
    name: Game (Android, ${{ inputs.configuration || 'Release' }} ${{ inputs.arch || 'ARM64' }})
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      ARCH: ${{ inputs.arch || 'ARM64' }}
      CONFIG: ${{ inputs.configuration || 'Release' }}
    steps:
      - name: Checkout repo (shallow + LFS in one pass)
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 1
          show-progress: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Locate dotnet root
        id: dotnet-root
        shell: pwsh
        run: |
          $root = Split-Path (Get-Command dotnet).Source
          "root=$root" >> $env:GITHUB_OUTPUT
          Write-Host "dotnet root: $root"

      # One cache for the whole toolchain: Vulkan SDK (~1 GB install),
      # .NET workload packs/manifests and NuGet packages. Exact key hit =
      # restore in ~30-60s and zero re-upload (vs ~3-5 min of downloads).
      - name: Restore toolchain cache
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            C:\VulkanSDK
            ${{ steps.dotnet-root.outputs.root }}\packs
            ${{ steps.dotnet-root.outputs.root }}\sdk-manifests
            ${{ steps.dotnet-root.outputs.root }}\metadata
            ~/.nuget/packages
          key: android-toolchain-vulkan${{ env.VULKAN_VERSION }}-dotnet${{ env.DOTNET_VERSION }}-v1

      - name: Setup Vulkan SDK
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: ./.github/actions/vulkan
        with:
          vulkan-version: ${{ env.VULKAN_VERSION }}

      - name: Export VULKAN_SDK (cache hit)
        if: steps.cache-toolchain.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $sdk = 'C:\VulkanSDK'
          if (-not (Test-Path (Join-Path $sdk 'Include'))) {
            $cand = Get-ChildItem $sdk -Directory -ErrorAction SilentlyContinue |
              Where-Object { Test-Path (Join-Path $_.FullName 'Include') } |
              Sort-Object Name -Descending | Select-Object -First 1
            if ($cand) { $sdk = $cand.FullName }
          }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "VULKAN_SDK_VER=${{ env.VULKAN_VERSION }}" >> $env:GITHUB_ENV
          Write-Host "VULKAN_SDK=$sdk"

      - name: Install Android workload (only if missing)
        shell: pwsh
        run: |
          $list = dotnet workload list
          if ($list -match 'android') { Write-Host 'Android workload already installed, skipping.' }
          else { dotnet workload install android }

      # Incremental native compilation: restore Flax object files/depfiles from
      # the previous run on this branch. Full rebuild only on cache miss.
      - name: Restore Flax build cache
        uses: actions/cache@v4
        with:
          path: |
            Cache/Intermediate/FlaxGame
            Cache/Intermediate/Build
            Binaries/Tools
          key: flax-android-${{ env.ARCH }}-${{ env.CONFIG }}-${{ github.sha }}
          restore-keys: |
            flax-android-${{ env.ARCH }}-${{ env.CONFIG }}-

      - name: Build
        shell: pwsh
        run: |
          $t0 = Get-Date
          foreach ($f in 'global.json','Source/Tools/Flax.Build/global.json') {
            (Get-Content $f).Replace('latestMajor','minor') | Set-Content $f
          }
          (Get-Content 'Source/Tools/Flax.Build/Flax.Build.csproj').Replace('LatestMajor','Minor') | Set-Content 'Source/Tools/Flax.Build/Flax.Build.csproj'
          .\Development\Scripts\Windows\CallBuildTool.bat -build -log -printSDKs -dotnet=8 -arch=$env:ARCH -platform=Android -configuration=$env:CONFIG -buildtargets=FlaxGame
          $code = $LASTEXITCODE
          "### ⏱️ Build finished in $(((Get-Date) - $t0).ToString('mm\:ss')) (exit $code)" >> $env:GITHUB_STEP_SUMMARY
          exit $code

      - name: Upload game binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FlaxGame-Android-${{ env.ARCH }}-${{ env.CONFIG }}
          path: Binaries/FlaxGame/Android/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 1 # fastest upload, binaries are already dense

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlaxGame-Android-logs-${{ github.run_number }}
          path: Logs/**
          if-no-files-found: warn
          retention-days: 7
